<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Простой Fruit Ninja</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        
        /* Интерфейс */
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; pointer-events: none; text-shadow: 2px 2px 0 #000; }
        #lives { color: red; }
        
        /* Экраны меню */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; z-index: 10;
        }
        h1 { font-size: 50px; margin: 0 0 20px; color: #ffeb3b; }
        button {
            padding: 15px 40px; font-size: 24px; cursor: pointer;
            background: #4caf50; color: white; border: none; border-radius: 10px;
        }
        button:hover { background: #66bb6a; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="ui">
    Счёт: <span id="score">0</span> | Жизни: <span id="lives">❤❤❤</span>
</div>

<!-- Стартовый экран -->
<div id="start-screen" class="screen">
    <h1>ФРУТКИ</h1>
    <p>Режь фрукты, не трогай бомбы!</p>
    <button onclick="startGame()">ИГРАТЬ</button>
</div>

<!-- Экран проигрыша -->
<div id="game-over-screen" class="screen hidden">
    <h1>КОНЕЦ</h1>
    <p>Счёт: <span id="final-score">0</span></p>
    <button onclick="startGame()">ЕЩЁ РАЗ</button>
</div>

<canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    
    // Настройки
    let width, height;
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Звуковой движок (синтезатор)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'slice') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'bomb') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(10, now + 0.5);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        } else if (type === 'miss') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        }
    }

    // Игровые переменные
    let score = 0;
    let lives = 3;
    let gameRunning = false;
    let objects = []; // Фрукты и бомбы
    let particles = []; // Брызги
    let trail = []; // След меча
    let frame = 0;

    // Класс объекта (фрукт или бомба)
    class Obj {
        constructor() {
            this.x = Math.random() * (width - 100) + 50; // Случайная позиция по X
            this.y = height + 50; // Старт снизу за экраном
            this.vx = (Math.random() - 0.5) * 4; // Немного в сторону
            this.vy = -(Math.random() * 5 + 12); // Вверх (скорость)
            this.radius = 30;
            this.rotation = 0;
            this.rotSpeed = (Math.random() - 0.5) * 0.2;
            
            // 15% шанс бомбы
            this.isBomb = Math.random() < 0.15;
            this.color = this.isBomb ? '#333' : ['#f00', '#fa0', '#ff0', '#0f0'][Math.floor(Math.random()*4)];
            this.sliced = false;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.2; // Гравитация
            this.rotation += this.rotSpeed;

            // Если упал вниз
            if (this.y > height + 60 && !this.sliced) {
                if (!this.isBomb) {
                    lives--;
                    playSound('miss');
                    updateUI();
                    if (lives <= 0) endGame();
                }
                return true; // Удалить объект
            }
            return false;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            
            if (this.isBomb) {
                // Рисуем бомбу
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'red';
                ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill(); // Фитиль
                ctx.fillStyle = 'white';
                ctx.font = '20px Arial'; ctx.fillText('☠️', -10, 7);
            } else {
                // Рисуем фрукт
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                ctx.fill();
                // Блик
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.arc(-10, -10, 8, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    // Частицы (брызги)
    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 10;
            this.vy = (Math.random() - 0.5) * 10;
            this.life = 1.0;
            this.color = color;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.3; // Гравитация для брызг
            this.life -= 0.03;
            return this.life <= 0;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    // Управление мышью/тачем
    let isDrawing = false;
    function inputStart(e) { isDrawing = true; addPoint(e); }
    function inputEnd() { isDrawing = false; trail = []; }
    function inputMove(e) {
        if (!isDrawing || !gameRunning) return;
        addPoint(e);
        checkCollisions();
    }

    function getPos(e) {
        if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        return { x: e.clientX, y: e.clientY };
    }

    function addPoint(e) {
        const pos = getPos(e);
        trail.push({ x: pos.x, y: pos.y, life: 10 });
        if (trail.length > 8) trail.shift();
    }

    window.addEventListener('mousedown', inputStart);
    window.addEventListener('mouseup', inputEnd);
    window.addEventListener('mousemove', inputMove);
    window.addEventListener('touchstart', inputStart, {passive: false});
    window.addEventListener('touchend', inputEnd);
    window.addEventListener('touchmove', (e) => { e.preventDefault(); inputMove(e); }, {passive: false});

    function checkCollisions() {
        if (trail.length < 2) return;
        const tip = trail[trail.length - 1];

        objects.forEach(obj => {
            if (obj.sliced) return;
            const dx = tip.x - obj.x;
            const dy = tip.y - obj.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < obj.radius + 10) {
                obj.sliced = true;
                if (obj.isBomb) {
                    playSound('bomb');
                    endGame();
                } else {
                    playSound('slice');
                    score++;
                    updateUI();
                    // Создаем брызги
                    for(let i=0; i<10; i++) particles.push(new Particle(obj.x, obj.y, obj.color));
                }
            }
        });
    }

    function updateUI() {
        document.getElementById('score').innerText = score;
        let hearts = '';
        for(let i=0; i<lives; i++) hearts += '❤';
        document.getElementById('lives').innerText = hearts;
    }

    function startGame() {
        // Инициализация звукового контекста по клику
        if (audioCtx.state === 'suspended') audioCtx.resume();

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        
        score = 0;
        lives = 3;
        objects = [];
        particles = [];
        trail = [];
        gameRunning = true;
        frame = 0;
        updateUI();
        loop();
    }

    function endGame() {
        gameRunning = false;
        document.getElementById('final-score').innerText = score;
        document.getElementById('game-over-screen').classList.remove('hidden');
    }

    function loop() {
        if (!gameRunning) return;
        
        ctx.clearRect(0, 0, width, height);
        frame++;

        // Спавн фруктов (каждые 40 кадров, уменьшается со временем)
        if (frame % Math.max(20, 60 - Math.floor(score/2)) === 0) {
            objects.push(new Obj());
        }

        // Отрисовка следа
        if (trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(trail[0].x, trail[0].y);
            for (let i = 1; i < trail.length; i++) {
                ctx.lineTo(trail[i].x, trail[i].y);
                trail[i].life--;
            }
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'cyan';
            ctx.stroke();
            ctx.shadowBlur = 0;
            trail = trail.filter(p => p.life > 0);
        }

        // Обновление объектов
        objects = objects.filter(obj => !obj.update());
        objects.forEach(obj => obj.draw());

        // Обновление частиц
        particles = particles.filter(p => !p.update());
        particles.forEach(p => p.draw());
