<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fruit Ninja - Исправленная версия</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* Интерфейс */
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .hud { padding: 20px; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; display: flex; justify-content: space-between; }
        
        /* Экраны меню */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; pointer-events: auto; z-index: 10;
        }
        .hidden { display: none !important; }
        
        h1 { font-size: 48px; color: #ffeb3b; margin-bottom: 10px; text-transform: uppercase; }
        p { font-size: 18px; color: #ccc; margin-bottom: 30px; }
        
        .btn-group { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        button {
            padding: 15px 30px; font-size: 18px; border: none; border-radius: 8px;
            cursor: pointer; color: white; font-weight: bold; transition: transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:active { transform: scale(0.95); }
        .btn-easy { background: #4caf50; }
        .btn-med { background: #ff9800; }
        .btn-hard { background: #f44336; }
        .btn-restart { background: #2196f3; font-size: 24px; padding: 20px 50px; }

        /* Комбо текст */
        .combo-pop {
            position: absolute; color: #fff; font-weight: 900; font-size: 32px;
            text-shadow: 0 0 10px #ff00de; pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui">
    <div class="hud">
        <div id="scoreDisplay">Счет: 0</div>
        <div id="livesDisplay">❤❤❤</div>
    </div>
</div>

<!-- Главное меню -->
<div id="startScreen" class="screen">
    <h1>Фруктовый Ниндзя</h1>
    <p>Выберите сложность:</p>
    <div class="btn-group">
        <button class="btn-easy" onclick="startGame('easy')">Лёгкий</button>
        <button class="btn-med" onclick="startGame('medium')">Средний</button>
        <button class="btn-hard" onclick="startGame('hard')">Сложный</button>
    </div>
</div>

<!-- Game Over -->
<div id="gameOverScreen" class="screen hidden">
    <h1>Игра Окончена</h1>
    <p>Ваш счет: <span id="finalScore">0</span></p>
    <button class="btn-restart" onclick="showStartScreen()">В Меню</button>
</div>

<script>
/**
 * ПРОСТОЙ И НАДЕЖНЫЙ КОД
 * Исправлена проблема со спавном и размерами canvas
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Настройки игры
let gameState = {
    isRunning: false,
    score: 0,
    lives: 3,
    difficulty: 'medium',
    fruits: [],
    particles: [],
    slicedFruits: [],
    blade: [],
    combo: 0,
    lastSliceTime: 0,
    spawnTimer: 0
};

// Конфигурация сложности
const DIFFICULTY = {
    easy: { spawnRate: 60, bombChance: 0.1, speedMult: 0.8 },
    medium: { spawnRate: 40, bombChance: 0.2, speedMult: 1.0 },
    hard: { spawnRate: 25, bombChance: 0.35, speedMult: 1.3 }
};

// Звуковой контекст (ленивая инициализация)
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === 'slice') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'bomb') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(10, now + 0.5);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
    }
}

// --- КЛАССЫ ---

class Fruit {
    constructor(w, h, type) {
        this.radius = 30 + Math.random() * 10;
        // ГАРАНТИРОВАННЫЙ СПАВН СНИЗУ
        this.x = Math.random() * (w - this.radius * 2) + this.radius; 
        this.y = h + this.radius; 
        
        // Физика броска
        const config = DIFFICULTY[gameState.difficulty];
        const force = (Math.random() * 5 + 12) * config.speedMult; // Сила броска
        const angle = -Math.PI / 2 + (Math.random() * 0.4 - 0.2); // Небольшой разброс угла
        
        this.vx = Math.cos(angle) * force * 0.3; // Горизонтальная скорость
        this.vy = Math.sin(angle) * force;       // Вертикальная скорость
        
        this.rotation = 0;
        this.rotSpeed = (Math.random() - 0.5) * 0.2;
        this.type = type; // 'fruit' or 'bomb'
        this.color = type === 'bomb' ? '#333' : ['#f44336', '#ff9800', '#ffeb3b', '#4caf50'][Math.floor(Math.random()*4)];
        this.active = true;
        this.sliced = false;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.25; // Гравитация
        this.rotation += this.rotSpeed;

        // Удаление если упал вниз
        if (this.y > canvas.height + 50 && this.active && !this.sliced) {
            this.active = false;
            if (this.type !== 'bomb') {
                loseLife();
            }
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        
        if (this.type === 'bomb') {
            ctx.fillStyle = '#222';
            ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill();
            // Фитиль
            ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, -this.radius); ctx.lineTo(10, -this.radius-10); ctx.stroke();
            // Искра
            ctx.fillStyle = '#ff5722';
            ctx.beginPath(); ctx.arc(10, -this.radius-10, 4+Math.random()*2, 0, Math.PI*2); ctx.fill();
            // Знак
            ctx.fillStyle = 'white'; ctx.font = '20px Arial'; ctx.textAlign='center'; ctx.fillText('☠️', 0, 5);
        } else {
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill();
            // Блик
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath(); ctx.arc(-10, -10, this.radius/3, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y;
        this.color = color;
        this.size = Math.random() * 5 + 2;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.life = 1.0;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.vy += 0.2; // Гравитация
        this.life -= 0.03;
    }
    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

// --- ЛОГИКА ИГРЫ ---

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

function startGame(difficulty) {
    initAudio();
    resizeCanvas(); // Критически важно: обновить размеры перед стартом
    
    gameState.difficulty = difficulty;
    gameState.score = 0;
    gameState.lives = 3;
    gameState.fruits = [];
    gameState.particles = [];
    gameState.slicedFruits = [];
    gameState.blade = [];
    gameState.combo = 0;
    gameState.isRunning = true;
    gameState.spawnTimer = 0;

    updateUI();
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    
    requestAnimationFrame(gameLoop);
}

function showStartScreen() {
    gameState.isRunning = false;
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('startScreen').classList.remove('hidden');
}

function gameOver() {
    gameState.isRunning = false;
    playSound('bomb');
    document.getElementById('finalScore').innerText = gameState.score;
    document.getElementById('gameOverScreen').classList.remove('hidden');
}

function loseLife() {
    gameState.lives--;
    gameState.combo = 0;
    updateUI();
    if (gameState.lives <= 0) gameOver();
}

function createExplosion(x, y, color) {
    for(let i=0; i<15; i++) {
        gameState.particles.push(new Particle(x, y, color));
    }
}

function showComboText(x, y, text) {
    const el = document.createElement('div');
    el.className = 'combo-pop';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.innerText = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
}

function updateUI() {
    document.getElementById('scoreDisplay').innerText = `Счет: ${gameState.score}`;
    let hearts = '';
    for(let i=0; i<gameState.lives; i++) hearts += '❤';
    document.getElementById('livesDisplay').innerText = hearts;
}

// --- ОБРАБОТКА ВВОДА ---

function handleInput(x, y) {
    if (!gameState.isRunning) return;
    
    // Добавляем точку в след меча
    gameState.blade.push({x, y, life: 1.0});
    if (gameState.blade.length > 10) gameState.blade.shift();

    // Проверка попаданий
    const now = Date.now();
    let hitSomething = false;

    for (let i = gameState.fruits.length - 1; i >= 0; i--) {
        const f = gameState.fruits[i];
        if (f.sliced || f.type === 'bomb' && !f.active) continue;

        const dx = x - f.x;
        const dy = y - f.y;
        if (dx*dx + dy*dy < f.radius * f.radius) {
            // ПОПАДАНИЕ
            if (f.type === 'bomb') {
                gameOver();
                return;
            }
            
            f.sliced = true;
            f.active = false;
            gameState.fruits.splice(i, 1);
            
            createExplosion(f.x, f.y, f.color);
            playSound('slice');
            
            // Комбо логика
            if (now - gameState.lastSliceTime < 300) {
                gameState.combo++;
            } else {
                gameState.combo = 1;
            }
            gameState.lastSliceTime = now;

            // Очки
            let points = 1;
            if (gameState.combo >= 3) { points = 3; showComboText(f.x, f.y, "COMBO!"); }
            if (gameState.combo >= 5) { points = 5; showComboText(f.x, f.y, "FRENZY!"); }
            
            gameState.score += points;
            updateUI();
            hitSomething = true;
        }
    }
    
    if (!hitSomething) gameState.combo = 0;
}

canvas.addEventListener('mousedown', e => handleInput(e.clientX, e.clientY));
canvas.addEventListener('mousemove', e => {
    if (e.buttons === 1) handleInput(e.clientX, e.clientY);
});
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    handleInput(e.touches[0].clientX, e.touches[0].clientY);
}, {passive: false});
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    handleInput(e.touches[0].clientX, e.touches[0].clientY);
}, {passive: false});

// --- ГЛАВНЫЙ ЦИКЛ ---

function gameLoop() {
    if (!gameState.isRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Спавн фруктов
    gameState.spawnTimer++;
    const rate = DIFFICULTY[gameState.difficulty].spawnRate;
    if (gameState.spawnTimer > rate) {
        const isBomb = Math.random() < DIFFICULTY[gameState.difficulty].bombChance;
        gameState.fruits.push(new Fruit(canvas.width, canvas.height, isBomb ? 'bomb' : 'fruit'));
        gameState.spawnTimer = 0;
    }

    // Обновление и отрисовка фруктов
    gameState.fruits.forEach((f, index) => {
        f.update();
        f.draw(ctx);
        if (!f.active && !f.sliced) gameState.fruits.splice(index, 1);
    });

    // Частицы
    gameState.particles.forEach((p, index) => {
        p.update();
        p.draw(ctx);
        if (p.life <= 0) gameState.particles.splice(index, 1);
    });

    // След меча
    if (gameState.blade.length > 1) {
        ctx.beginPath();
        ctx.moveTo(gameState.blade[0].x, gameState.blade[0].y);
        for (let i = 1; i < gameState.blade.length; i++) {
            const point = gameState.blade[i];
            ctx.lineTo(point.x, point.y);
            point.life -= 0.2;
        }
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 10;
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ffff';
        ctx.stroke();
        ctx.shadowBlur = 0;
        
        // Удаляем старые точки
        gameState.blade = gameState.blade.filter(p => p.life > 0);
    }

    requestAnimationFrame(gameLoop);
}

// Инициализация размеров при загрузке
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

</script>
</body>
</html>
