<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fruit Ninja - 3 Уровня Сложности</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #222;
            font-family: 'Segoe UI', sans-serif;
            touch-action: none;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #3e2723, #5d4037);
        }

        canvas { display: block; }

        /* UI Elements */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .lives { color: #ff4444; }

        /* Screens */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            pointer-events: auto;
            transition: opacity 0.3s;
        }

        .hidden { display: none !important; }

        h1 { font-size: 3rem; margin: 0 0 10px 0; color: #ffeb3b; text-transform: uppercase; }
        h2 { font-size: 2rem; margin-bottom: 20px; }
        p { font-size: 1.2rem; color: #ccc; margin-bottom: 30px; }

        .btn-group { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            transition: transform 0.1s, filter 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        button:hover { transform: scale(1.05); filter: brightness(1.1); }
        button:active { transform: scale(0.95); }

        .btn-easy { background: linear-gradient(to bottom, #66bb6a, #2e7d32); }
        .btn-medium { background: linear-gradient(to bottom, #ffa726, #ef6c00); }
        .btn-hard { background: linear-gradient(to bottom, #ef5350, #c62828); }
        .btn-restart { background: linear-gradient(to bottom, #42a5f5, #1565c0); }

        /* Combo Text */
        .combo-pop {
            position: absolute;
            color: #fff;
            font-weight: 900;
            font-size: 2rem;
            text-shadow: 0 0 10px #ff00de;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-layer">
        <div class="hud">
            <div id="scoreDisplay">Счет: 0</div>
            <div id="livesDisplay" class="lives">❤❤❤</div>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="menu-screen" class="screen">
        <h1>Фруктовый Ниндзя</h1>
        <p>Выберите сложность:</p>
        <div class="btn-group">
            <button class="btn-easy" onclick="game.start('easy')">Легко</button>
            <button class="btn-medium" onclick="game.start('medium')">Нормально</button>
            <button class="btn-hard" onclick="game.start('hard')">Сложно</button>
        </div>
    </div>

    <!-- Game Over -->
    <div id="gameover-screen" class="screen hidden">
        <h1>Игра Окончена</h1>
        <h2 id="final-score">Счет: 0</h2>
        <button class="btn-restart" onclick="game.showMenu()">В Меню</button>
    </div>
</div>

<script>
/**
 * ПРОСТОЙ И ЧИСТЫЙ КОД ИГРЫ
 */

// Настройки сложности
const DIFFICULTY = {
    easy: { spawnRate: 60, bombChance: 0.1, speedMod: 0.8, gravity: 0.12 },
    medium: { spawnRate: 40, bombChance: 0.2, speedMod: 1.0, gravity: 0.15 },
    hard: { spawnRate: 20, bombChance: 0.35, speedMod: 1.4, gravity: 0.2 }
};

const COLORS = {
    apple: { main: '#e53935', inner: '#ffcdd2' },
    orange: { main: '#fb8c00', inner: '#ffe0b2' },
    lemon: { main: '#fdd835', inner: '#fff9c4' },
    watermelon: { main: '#2e7d32', inner: '#ef5350' },
    bomb: { main: '#212121' }
};

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());

        this.state = 'menu'; // menu, playing, gameover
        this.score = 0;
        this.lives = 3;
        this.difficulty = 'medium';
        
        this.entities = []; // Фрукты и бомбы
        this.particles = [];
        this.sliced = []; // Разрезанные фрукты
        this.trail = [];
        
        this.inputActive = false;
        this.lastInput = { x: 0, y: 0 };
        this.combo = 0;
        this.comboTimer = 0;

        // Audio Context (initialized on first interaction)
        this.audioCtx = null;

        // Inputs
        const startInput = (x, y) => { this.inputActive = true; this.lastInput = {x, y}; };
        const moveInput = (x, y) => {
            if (!this.inputActive || this.state !== 'playing') return;
            this.trail.push({ x, y, life: 1 });
            this.checkHit(x, y);
            this.lastInput = { x, y };
        };
        const endInput = () => { 
            this.inputActive = false; 
            this.trail = []; 
            this.combo = 0; 
        };

        this.canvas.addEventListener('mousedown', e => startInput(e.clientX, e.clientY));
        this.canvas.addEventListener('mousemove', e => moveInput(e.clientX, e.clientY));
        this.canvas.addEventListener('mouseup', endInput);
        
        this.canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            startInput(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});
        this.canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            moveInput(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});
        this.canvas.addEventListener('touchend', endInput);

        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }

    initAudio() {
        if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    playSound(type) {
        if (!this.audioCtx) return;
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.connect(gain);
        gain.connect(this.audioCtx.destination);

        const now = this.audioCtx.currentTime;
        
        if (type === 'slice') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'bomb') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(10, now + 0.5);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        } else if (type === 'miss') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        }
    }

    showMenu() {
        this.state = 'menu';
        document.getElementById('menu-screen').classList.remove('hidden');
        document.getElementById('gameover-screen').classList.add('hidden');
        this.entities = [];
        this.particles = [];
        this.sliced = [];
        this.drawBackground();
    }

    start(diff) {
        this.initAudio();
        this.difficulty = diff;
        this.state = 'playing';
        this.score = 0;
        this.lives = 3;
        this.entities = [];
        this.particles = [];
        this.sliced = [];
        this.trail = [];
        this.frame = 0;
        
        this.updateUI();
        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('gameover-screen').classList.add('hidden');
    }

    gameOver() {
        this.state = 'gameover';
        this.playSound('bomb');
        document.getElementById('final-score').innerText = 'Счет: ' + this.score;
        document.getElementById('gameover-screen').classList.remove('hidden');
    }

    spawn() {
        const settings = DIFFICULTY[this.difficulty];
        const isBomb = Math.random() < settings.bombChance;
        const types = ['apple', 'orange', 'lemon', 'watermelon'];
        const type = isBomb ? 'bomb' : types[Math.floor(Math.random() * types.length)];
        
        const radius = 30 + Math.random() * 10;
        // Спавн снизу за пределами экрана в случайной точке по X
        const x = Math.random() * (this.canvas.width - radius * 2) + radius;
        const y = this.canvas.height + radius;
        
        // Расчет скорости для достижения определенной высоты
        const targetHeight = Math.random() * (this.canvas.height * 0.4) + (this.canvas.height * 0.2);
        const vy = -Math.sqrt(2 * settings.gravity * (targetHeight - y)) * settings.speedMod;
        const vx = (Math.random() - 0.5) * 4 * settings.speedMod;

        this.entities.push({
            x, y, vx, vy, radius, type, rotation: 0, rotSpeed: (Math.random() - 0.5) * 0.2,
            sliced: false
        });
    }

    checkHit(x, y) {
        let hitCount = 0;
        for (let i = this.entities.length - 1; i >= 0; i--) {
            const e = this.entities[i];
            if (e.sliced) continue;
            
            const dx = x - e.x;
            const dy = y - e.y;
            if (dx*dx + dy*dy < e.radius * e.radius) {
                if (e.type === 'bomb') {
                    this.createParticles(e.x, e.y, '#fff', 50);
                    this.gameOver();
                    return;
                }
                
                e.sliced = true;
                this.entities.splice(i, 1);
                this.sliced.push({ ...e, life: 1, split: 1 });
                this.createParticles(e.x, e.y, COLORS[e.type].main, 10);
                this.playSound('slice');
                
                this.score++;
                this.combo++;
                this.comboTimer = 20; // frames to keep combo
                hitCount++;
            }
        }

        if (hitCount > 1) {
            this.showComboText(x, y, hitCount);
        }
        this.updateUI();
    }

    createParticles(x, y, color, count) {
        for(let i=0; i<count; i++) {
            this.particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1,
                color
            });
        }
    }

    showComboText(x, y, count) {
        const texts = ["", "", "COMBO!", "FRENZY!", "INSANE!", "GODLIKE!"];
        const text = texts[Math.min(count, texts.length - 1)] || count + "x";
        const el = document.createElement('div');
        el.className = 'combo-pop';
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.innerText = text;
        document.getElementById('game-container').appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    updateUI() {
        document.getElementById('scoreDisplay').innerText = 'Счет: ' + this.score;
        document.getElementById('livesDisplay').innerText = '❤'.repeat(this.lives);
    }

    update() {
        if (this.state !== 'playing') return;
        this.frame++;
        const settings = DIFFICULTY[this.difficulty];

        // Spawn
        if (this.frame % settings.spawnRate === 0) this.spawn();

        // Update Entities
        for (let i = this.entities.length - 1; i >= 0; i--) {
            const e = this.entities[i];
            e.x += e.vx;
            e.y += e.vy;
            e.vy += settings.gravity;
            e.rotation += e.rotSpeed;

            if (e.y > this.canvas.height + 50 && !e.sliced) {
                this.entities.splice(i, 1);
                if (e.type !== 'bomb') {
                    this.lives--;
                    this.playSound('miss');
                    this.updateUI();
                    if (this.lives <= 0) this.gameOver();
                }
            }
        }

        // Update Sliced
        for (let i = this.sliced.length - 1; i >= 0; i--) {
            const s = this.sliced[i];
            s.life -= 0.02;
            s.y += s.vy;
            s.vy += settings.gravity;
            if (s.life <= 0) this.sliced.splice(i, 1);
        }

        // Update Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2;
            p.life -= 0.02;
            if (p.life <= 0) this.particles.splice(i, 1);
        }

        // Update Trail
        this.trail.forEach(t => t.life -= 0.15);
        this.trail = this.trail.filter(t => t.life > 0);

        // Combo decay
        if (this.comboTimer > 0) this.comboTimer--;
        else this.combo = 0;
    }

    drawBackground() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    }

    drawEntity(e, isSliced = false) {
        this.ctx.save();
        this.ctx.translate(e.x, e.y);
        this.ctx.rotate(e.rotation);
        
        const colors = COLORS[e.type];
        
        if (e.type === 'bomb') {
            this.ctx.beginPath();
            this.ctx.arc(0, 0, e.radius, 0, Math.PI*2);
            this.ctx.fillStyle = '#111';
            this.ctx.fill();
            // Fuse spark
            this.ctx.fillStyle = `rgba(255, 87, 34, ${0.5 + Math.random()*0.5})`;
            this.ctx.beginPath();
            this.ctx.arc(10, -10, 5, 0, Math.PI*2);
            this.ctx.fill();
            this.ctx.fillStyle = '#fff';
            this.ctx.font = '20px Arial';
            this.ctx.textAlign = 'center';
            this.ctx.textBaseline = 'middle';
            this.ctx.fillText('☠️', 0, 2);
        } else {
            // Fruit Body
            this.ctx.beginPath();
            this.ctx.arc(0, 0, e.radius, 0, Math.PI*2);
            this.ctx.fillStyle = colors.main;
            this.ctx.fill();
            
            // Inner
            this.ctx.beginPath();
            this.ctx.arc(0, 0, e.radius * 0.8, 0, Math.PI*2);
            this.ctx.fillStyle = colors.inner;
            this.ctx.fill();

            // If sliced, draw two halves slightly apart visually in the 'sliced' array logic
            // But here we just draw the whole fruit for the entity list
            if (isSliced) {
                 // Simple visual hack for sliced effect in the main loop if needed, 
                 // but we handle sliced separately in the loop below
            }
        }
        this.ctx.restore();
    }

    draw() {
        this.drawBackground();

        // Draw Entities
        this.entities.forEach(e => this.drawEntity(e));

        // Draw Sliced Fruits (Two halves)
        this.sliced.forEach(s => {
            this.ctx.save();
            this.ctx.globalAlpha = s.life;
            this.ctx.translate(s.x, s.y);
            
            // Half 1
            this.ctx.save();
            this.ctx.rotate(s.rotation - 0.2);
            this.ctx.translate(-10, 0);
            this.ctx.beginPath();
            this.ctx.arc(0, 0, s.radius, Math.PI/2, Math.PI*1.5);
            this.ctx.lineTo(0,0);
            this.ctx.fillStyle = COLORS[s.type].main;
            this.ctx.fill();
            this.ctx.restore();

            // Half 2
            this.ctx.save();
            this.ctx.rotate(s.rotation + 0.2);
            this.ctx.translate(10, 0);
            this.ctx.beginPath();
            this.ctx.arc(0, 0, s.radius, -Math.PI/2, Math.PI/2);
            this.ctx.lineTo(0,0);
            this.ctx.fillStyle = COLORS[s.type].main;
            this.ctx.fill();
            this.ctx.restore();

            this.ctx.restore();
        });

        // Draw Particles
        this.particles.forEach(p => {
            this.ctx.globalAlpha = p.life;
            this.ctx.fillStyle = p.color;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
            this.ctx.fill();
        });
        this.ctx.globalAlpha = 1;

        // Draw Trail
        if (this.trail.length > 1) {
            this.ctx.beginPath();
            this.ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) {
                // Smooth curve could be added, but lines are fine for ninja feel
                this.ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            this.ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
            this.ctx.lineWidth = 8;
            this.ctx.lineCap = 'round';
            this.ctx.lineJoin = 'round';
            this.ctx.shadowBlur = 10;
            this.ctx.shadowColor = '#00ffff';
            this.ctx.stroke();
            this.ctx.shadowBlur = 0;
        }
    }

    loop() {
        this.update();
        this.draw();
        requestAnimationFrame(this.loop);
    }
}

// Start Game Instance
const game = new Game();

</script>
</body>
</html>
