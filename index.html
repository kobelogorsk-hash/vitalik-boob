<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Фруктовый Ниндзя</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* Интерфейс */
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; pointer-events: none; text-shadow: 2px 2px 0 #000; }
        #lives { position: absolute; top: 20px; right: 20px; color: red; font-size: 30px; pointer-events: none; }
        
        /* Экраны меню */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; z-index: 10;
        }
        .hidden { display: none !important; }
        h1 { font-size: 60px; margin: 0 0 20px; color: #ffeb3b; text-shadow: 0 0 20px orange; }
        button {
            padding: 20px 50px; font-size: 30px; background: #4caf50; color: white;
            border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        button:hover { background: #66bb6a; transform: scale(1.05); }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <canvas id="game"></canvas>
    
    <div id="ui">Счет: <span id="scoreVal">0</span></div>
    <div id="lives">❤❤❤</div>

    <!-- Стартовый экран -->
    <div id="startScreen" class="screen">
        <h1>ФРУКТОВЫЙ НИДЗЯ</h1>
        <button id="btnStart">ИГРАТЬ</button>
    </div>

    <!-- Экран проигрыша -->
    <div id="gameOverScreen" class="screen hidden">
        <h1>ИГРА ОКОНЧЕНА</h1>
        <p style="font-size: 30px">Счет: <span id="finalScore">0</span></p>
        <button id="btnRestart">ЕЩЁ РАЗ</button>
    </div>

<script>
// --- НАСТРОЙКИ И ПЕРЕМЕННЫЕ ---
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

// Состояние игры
let gameRunning = false;
let score = 0;
let lives = 3;
let fruits = [];
let particles = [];
let blade = [];
let lastTime = 0;
let spawnTimer = 0;

// Аудио контекст (создается при первом клике)
let audioCtx = null;

// --- ЗВУКИ (Синтезатор) ---
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    
    if (type === 'slice') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'bomb') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(10, now + 0.5);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
    } else if (type === 'miss') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    }
}

// --- КЛАССЫ ОБЪЕКТОВ ---

class Fruit {
    constructor() {
        this.r = 30 + Math.random() * 20; // Радиус
        this.x = Math.random() * (W - 100) + 50; // Случайная позиция по X
        this.y = H + this.r; // Старт снизу за экраном
        
        // Физика полета
        const angle = -Math.PI / 2 + (Math.random() * 0.4 - 0.2); // Вверх с небольшим отклонением
        const speed = 12 + Math.random() * 6;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.gravity = 0.25;
        
        this.rot = 0;
        this.rotSpeed = (Math.random() - 0.5) * 0.2;
        
        // Тип фрукта
        const types = ['apple', 'orange', 'watermelon'];
        this.type = types[Math.floor(Math.random() * types.length)];
        
        // Шанс бомбы (15%)
        if (Math.random() < 0.15) this.type = 'bomb';
        
        this.active = true;
        this.sliced = false;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.rot += this.rotSpeed;

        // Если упал вниз
        if (this.y > H + 50 && !this.sliced) {
            this.active = false;
            if (this.type !== 'bomb') {
                loseLife();
            }
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        
        if (this.type === 'bomb') {
            // Рисуем бомбу
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI*2); ctx.fill();
            // Фитиль
            ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, -this.r); ctx.lineTo(10, -this.r-10); ctx.stroke();
            // Искра
            ctx.fillStyle = 'red';
            ctx.beginPath(); ctx.arc(10, -this.r-10, 4+Math.random()*3, 0, Math.PI*2); ctx.fill();
            // Череп
            ctx.fillStyle = '#fff'; ctx.font = '20px Arial'; ctx.fillText('☠️', -10, 5);
        } else {
            // Рисуем фрукты
            if (this.type === 'apple') ctx.fillStyle = '#e53935';
            if (this.type === 'orange') ctx.fillStyle = '#fb8c00';
            if (this.type === 'watermelon') ctx.fillStyle = '#2e7d32';
            
            ctx.beginPath();
            ctx.arc(0, 0, this.r, 0, Math.PI*2);
            ctx.fill();
            
            // Блик
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath(); ctx.arc(-10, -10, this.r/3, 0, Math.PI*2); ctx.fill();
        }
        
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = 0.02 + Math.random() * 0.03;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.1; // Гравитация частиц
        this.life -= this.decay;
    }
    draw() {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

// --- ЛОГИКА ИГРЫ ---

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Обработчики кнопок
    document.getElementById('btnStart').addEventListener('click', startGame);
    document.getElementById('btnRestart').addEventListener('click', startGame);
    
    // Обработчики мыши/тача
    canvas.addEventListener('mousedown', startSlice);
    canvas.addEventListener('mousemove', moveSlice);
    canvas.addEventListener('mouseup', endSlice);
    canvas.addEventListener('touchstart', (e) => startSlice(e.touches[0]));
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); moveSlice(e.touches[0]); });
    canvas.addEventListener('touchend', endSlice);
    
    requestAnimationFrame(loop);
}

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

function startGame() {
    // Инициализация аудио при первом клике
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    score = 0;
    lives = 3;
    fruits = [];
    particles = [];
    blade = [];
    gameRunning = true;
    spawnTimer = 0;
    
    updateUI();
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
}

function gameOver() {
    gameRunning = false;
    document.getElementById('finalScore').innerText = score;
    document.getElementById('gameOverScreen').classList.remove('hidden');
    playSound('bomb');
}

function loseLife() {
    lives--;
    playSound('miss');
    updateUI();
    if (lives <= 0) gameOver();
}

function updateUI() {
    document.getElementById('scoreVal').innerText = score;
    let hearts = '';
    for(let i=0; i<lives; i++) hearts += '❤';
    document.getElementById('lives').innerText = hearts;
}

// Управление лезвием
let isSlicing = false;
function startSlice(e) {
    if (!gameRunning) return;
    isSlicing = true;
    blade = [{x: e.clientX, y: e.clientY}];
}
function moveSlice(e) {
    if (!isSlicing || !gameRunning) return;
    const x = e.clientX, y = e.clientY;
    blade.push({x, y});
    if (blade.length > 8) blade.shift(); // Хвост лезвия
    
    checkCollisions(x, y);
}
function endSlice() {
    isSlicing = false;
    blade = [];
}

function checkCollisions(mx, my) {
    for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        if (f.sliced) continue;
        
        const dx = f.x - mx;
        const dy = f.y - my;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < f.r + 10) {
            sliceFruit(f, i);
        }
    }
}

function sliceFruit(f, index) {
    if (f.type === 'bomb') {
        createExplosion(f.x, f.y, '#fff', 50);
        gameOver();
        return;
    }
    
    f.sliced = true;
    f.active = false;
    score++;
    playSound('slice');
    
    // Эффекты
    let color = '#e53935';
    if (f.type === 'orange') color = '#fb8c00';
    if (f.type === 'watermelon') color = '#ef5350';
    createExplosion(f.x, f.y, color, 15);
    
    updateUI();
}

function createExplosion(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push(new Particle(x, y, color));
    }
}

// --- ГЛАВНЫЙ ЦИКЛ ---
function loop(timestamp) {
    const dt = timestamp - lastTime;
    lastTime = timestamp;
    
    // Очистка
    ctx.clearRect(0, 0, W, H);
    
    if (gameRunning) {
        // Спавн фруктов
        spawnTimer++;
        if (spawnTimer > 40) { // Каждые ~40 кадров (0.6 сек)
            fruits.push(new Fruit());
            spawnTimer = 0;
        }
        
        // Обновление фруктов
        fruits.forEach(f => f.update());
        fruits = fruits.filter(f => f.active);
        
        // Отрисовка фруктов
        fruits.forEach(f => f.draw());
    }
    
    // Частицы (всегда обновляются, даже при Game Over для красоты)
    particles.forEach(p => p.update());
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => p.draw());
    
    // Лезвие
    if (blade.length > 1) {
        ctx.beginPath();
        ctx.moveTo(blade[0].x, blade[0].y);
        for (let i = 1; i < blade.length; i++) {
            // Кривая Безье для плавности
            // ctx.lineTo(blade[i].x, blade[i].y); 
            // Простая линия быстрее и надежнее для высокой частоты
             ctx.lineTo(blade[i].x, blade[i].y);
        }
        ctx.strokeStyle = '#0ff';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#0ff';
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
    
    requestAnimationFrame(loop);
}

// Запуск
init();

</script>
</body>
</html>
