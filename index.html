<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fruit Ninja Simple</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* Интерфейс */
        #ui { position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        #lives { color: #ff4444; }
        
        /* Экраны меню */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; z-index: 10;
        }
        .hidden { display: none !important; }
        h1 { font-size: 60px; margin: 0 0 20px; color: #ffeb3b; text-transform: uppercase; }
        button {
            padding: 15px 40px; font-size: 24px; background: #4caf50; color: white;
            border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 0 #2e7d32;
        }
        button:active { transform: translateY(5px); box-shadow: none; }
        
        /* Текст комбо */
        .combo-text {
            position: absolute; color: #00ffff; font-weight: 900; font-size: 40px;
            text-shadow: 0 0 10px #00ffff; pointer-events: none; animation: floatUp 0.8s forwards;
        }
        @keyframes floatUp { to { transform: translateY(-50px) scale(1.5); opacity: 0; } }
    </style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
    Счет: <span id="score">0</span> | Жизни: <span id="lives">❤❤❤</span>
</div>

<div id="start-screen" class="screen">
    <h1>FRUIT SLICE</h1>
    <button id="btn-start">ИГРАТЬ</button>
</div>

<div id="game-over-screen" class="screen hidden">
    <h1>GAME OVER</h1>
    <p style="font-size: 24px">Счет: <span id="final-score">0</span></p>
    <button id="btn-restart">ЕЩЁ РАЗ</button>
</div>

<script>
/** 
 * ПРОСТОЙ ДВИЖОК ИГРЫ 
 * Без классов, чистая функциональность для стабильности
 */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let width, height;

// Настройки
const GRAVITY = 0.2;
const BLADE_COLOR = '#00ffff';
const FRUITS_TYPES = [
    { color: '#e53935', inner: '#ffcdd2', score: 1 }, // Яблоко
    { color: '#fb8c00', inner: '#ffe0b2', score: 2 }, // Апельсин
    { color: '#fdd835', inner: '#fff9c4', score: 3 }, // Лимон
    { color: '#8bc34a', inner: '#dcedc8', score: 5 }  // Лайм
];

// Состояние игры
let state = {
    running: false,
    score: 0,
    lives: 3,
    fruits: [],
    particles: [],
    blade: [],
    combo: 0,
    lastSliceTime: 0
};

// Аудио контекст (инициализируется при клике)
let audioCtx;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- ЗВУКИ (Синтезатор) ---
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    
    if (type === 'slice') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400 + Math.random()*200, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'bomb') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(10, now + 0.5);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
    } else if (type === 'miss') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    }
}

// --- ЛОГИКА ---

function spawnFruit() {
    if (!state.running) return;
    
    const type = FRUITS_TYPES[Math.floor(Math.random() * FRUITS_TYPES.length)];
    const isBomb = Math.random() < 0.15; // 15% шанс бомбы
    
    // Спавн снизу в случайной точке по X
    const startX = Math.random() * (width - 100) + 50;
    const startY = height + 50;
    
    // Целевая точка где-то в верхней трети экрана
    const targetX = Math.random() * width;
    const targetY = Math.random() * (height * 0.4) + 50;
    
    // Расчет скорости для попадания в цель
    const timeToPeak = 60; // кадров до вершины
    const vx = (targetX - startX) / timeToPeak;
    const vy = (targetY - startY) / timeToPeak - (GRAVITY * timeToPeak) / 2;

    state.fruits.push({
        x: startX, y: startY,
        vx: vx, vy: vy,
        radius: 30 + Math.random() * 10,
        rotation: 0,
        rotSpeed: (Math.random() - 0.5) * 0.2,
        type: isBomb ? 'bomb' : type,
        active: true
    });
}

function createParticles(x, y, color) {
    for(let i=0; i<15; i++) {
        state.particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: color
        });
    }
}

function showComboText(x, y, text) {
    const el = document.createElement('div');
    el.className = 'combo-text';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.innerText = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
}

function update() {
    if (!state.running) return;

    // Спавн
    if (Math.random() < 0.03) spawnFruit();

    // Обновление фруктов
    for (let i = state.fruits.length - 1; i >= 0; i--) {
        let f = state.fruits[i];
        f.x += f.vx;
        f.y += f.vy;
        f.vy += GRAVITY;
        f.rotation += f.rotSpeed;

        // Упал вниз
        if (f.y > height + 50 && f.active) {
            if (f.type !== 'bomb') {
                state.lives--;
                playSound('miss');
                updateUI();
                if (state.lives <= 0) gameOver();
            }
            state.fruits.splice(i, 1);
            state.combo = 0; // Сброс комбо при промахе
        }
    }

    // Обновление частиц
    for (let i = state.particles.length - 1; i >= 0; i--) {
        let p = state.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += GRAVITY;
        p.life -= 0.03;
        if (p.life <= 0) state.particles.splice(i, 1);
    }

    // Лезвие (исчезает)
    if (state.blade.length > 0) {
        state.blade[0].life -= 0.1;
        if (state.blade[0].life <= 0) state.blade.shift();
    }
}

function checkSlice(x, y) {
    if (!state.running) return;

    // Добавляем точку лезвия
    state.blade.unshift({ x, y, life: 1.0 });
    if (state.blade.length > 8) state.blade.pop();

    let hitCount = 0;

    for (let i = state.fruits.length - 1; i >= 0; i--) {
        let f = state.fruits[i];
        if (!f.active) continue;

        const dx = f.x - x;
        const dy = f.y - y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < f.radius) {
            // ПОПАДАНИЕ
            if (f.type === 'bomb') {
                playSound('bomb');
                createParticles(f.x, f.y, '#fff', 50);
                gameOver();
                return;
            }

            // Разрез фрукта
            f.active = false;
            state.fruits.splice(i, 1);
            
            createParticles(f.x, f.y, f.type.color);
            playSound('slice');
            
            hitCount++;
        }
    }

    if (hitCount > 0) {
        state.combo += hitCount;
        const now = Date.now();
        
        // Логика комбо: если удары быстрые
        if (now - state.lastSliceTime < 300) {
            if (state.combo >= 3) {
                const bonus = state.combo * 10;
                state.score += bonus;
                let msg = "COMBO!";
                if (state.combo > 5) msg = "FRENZY!";
                if (state.combo > 10) msg = "INSANE!";
                showComboText(x, y, msg + " +" + bonus);
            } else {
                state.score += hitCount * state.combo;
            }
        } else {
            state.combo = hitCount;
            state.score += hitCount;
        }
        
        state.lastSliceTime = now;
        updateUI();
    }
}

function updateUI() {
    document.getElementById('score').innerText = state.score;
    let hearts = "";
    for(let i=0; i<state.lives; i++) hearts += "❤";
    document.getElementById('lives').innerText = hearts;
}

function draw() {
    ctx.clearRect(0, 0, width, height);

    // Фрукты
    state.fruits.forEach(f => {
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.rotation);
        
        if (f.type === 'bomb') {
            ctx.beginPath();
            ctx.arc(0, 0, f.radius, 0, Math.PI*2);
            ctx.fillStyle = '#000';
            ctx.fill();
            ctx.fillStyle = 'red';
            ctx.font = '20px Arial';
            ctx.fillText('☠️', -10, 5);
        } else {
            // Тело
            ctx.beginPath();
            ctx.arc(0, 0, f.radius, 0, Math.PI*2);
            ctx.fillStyle = f.type.color;
            ctx.fill();
            // Внутренность
            ctx.beginPath();
            ctx.arc(0, 0, f.radius * 0.8, 0, Math.PI*2);
            ctx.fillStyle = f.type.inner;
            ctx.fill();
        }
        ctx.restore();
    });

    // Частицы
    state.particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    });

    // Лезвие
    if (state.blade.length > 1) {
        ctx.beginPath();
        ctx.moveTo(state.blade[0].x, state.blade[0].y);
        for (let i = 1; i < state.blade.length; i++) {
            ctx.lineTo(state.blade[i].x, state.blade[i].y);
        }
        ctx.strokeStyle = BLADE_COLOR;
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowBlur = 10;
        ctx.shadowColor = BLADE_COLOR;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// --- УПРАВЛЕНИЕ ИГРОЙ ---

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function startGame() {
    initAudio();
    state = {
        running: true,
        score: 0,
        lives: 3,
        fruits: [],
        particles: [],
        blade: [],
        combo: 0,
        lastSliceTime: 0
    };
    updateUI();
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
}

function gameOver() {
    state.running = false;
    document.getElementById('final-score').innerText = state.score;
    document.getElementById('game-over-screen').classList.remove('hidden');
}

// Обработчики событий
document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', startGame);

// Мышь и Тач
function handleInput(e) {
    e.preventDefault();
    let x, y;
    if (e.touches) {
        x = e.touches[0].clientX;
        y = e.touches[0].clientY;
    } else {
        x = e.clientX;
        y = e.clientY;
    }
    checkSlice(x, y);
}

canvas.addEventListener('mousemove', handleInput);
canvas.addEventListener('touchmove', handleInput, {passive: false});
canvas.addEventListener('mousedown', () => state.blade = []); // Сброс хвоста при нажатии
canvas.addEventListener('touchstart', () => state.blade = [], {passive: false});

// Запуск цикла отрисовки (меню тоже рисуется фоном)
loop();

</script>
</body>
</html>
